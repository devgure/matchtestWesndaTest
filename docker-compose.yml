version: '3.8'
services:
  backend:
    build: ./backend
    expose:
      - "3000"
    environment:
      - DATABASE_URL=mongodb://mongo:27017/matchai
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - mongo

  web:
    build: ./web
    expose:
      - "80"
    # No ports — only exposed via nginx

  admin:
    build: ./admin
    expose:
      - "80"
    # No ports — only exposed via nginx

  mongo:
    image: mongo:6
    volumes:
      - mongo_data:/data/db

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - web
      - admin
      - backend

volumes:
  mongo_data:
